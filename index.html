<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Kanban 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="toast-container" class="toast-container"></div>
  <header class="topbar">
    <h1>Vibe Kanban • Time de Agentes</h1>
    <div class="topbar-actions">
      <select id="driverSelect" style="margin-right: 10px;">
        <option value="mock">Mock Driver</option>
        <option value="gemini">Gemini CLI</option>
        <option value="copilot">Copilot SDK</option>
        <option value="opencode">OpenCode AI</option>
      </select>
      <button id="createAgentBtn">Novo Agente</button>
      <button id="settingsBtn">Configurações</button>
      <button id="toggleViewBtn">Alternar 2D / 3D</button>
      <button id="seedTasksBtn">Gerar tarefas exemplo</button>
      <button id="resetDataBtn" style="border-color: #ff6f6f; color: #ff6f6f;">Resetar Dados</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section id="dashboardStats" class="dashboard-stats">
        <h2>📊 Dashboard</h2>
        <div class="stat-grid">
          <div class="stat-item">
            <span class="stat-label">Pendentes</span>
            <span class="stat-value" id="statPending">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Concluídas</span>
            <span class="stat-value" id="statDone">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Agentes</span>
            <span class="stat-value" id="statAgents">0</span>
          </div>
        </div>
      </section>

      <section>
        <h2>Criar tarefa</h2>
        <form id="taskForm">
          <label>
            Fonte
            <select id="taskSource">
              <option value="product_manager">Product Manager</option>
              <option value="usuario">Usuário</option>
            </select>
          </label>
          <label>
            Título
            <input id="taskTitle" required placeholder="Ex: implementar autenticação" />
          </label>
          <label>
            Categoria
            <select id="taskCategory">
              <option value="roadmap">Roadmap</option>
              <option value="seguranca">Segurança</option>
              <option value="performance">Performance</option>
              <option value="funcionalidades">Funcionalidades</option>
              <option value="testes">Testes</option>
              <option value="features">Features</option>
            </select>
          </label>
          <label>
            Prioridade
            <select id="taskPriority">
              <option value="alta">Alta</option>
              <option value="media" selected>Média</option>
              <option value="baixa">Baixa</option>
            </select>
            <label>
              Repositório (Github)
              <input id="taskGithubRepo" placeholder="ex: empresa/projeto" />
            </label>
            <label>
              Descrição
              <textarea id="taskDescription" placeholder="Detalhes do card..." rows="3"></textarea>
            </label>
            <label>
              Tipo de Agente (CLI/Integração)
              <input id="taskAgentType" placeholder="ex: Gemini CLI, Copilot SDK" />
            </label>
            <label>
              Designar Agente Voluntário (Opcional)
              <select id="taskAgentAssign">
                <option value="">- Automático Direcionado -</option>
                <option value="gemini-coder">Gemini Coder</option>
                <option value="sec-bot">Sec Bot</option>
                <option value="perf-optimizer">Perf Optimizer</option>
                <option value="feature-lead">Feature Lead</option>
                <option value="qa-bot">QA Bot</option>
              </select>
            </label>
            <label>
              Modelo Lógico
              <select id="taskAgentModel">
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
              </select>
            </label>
            <button type="submit">Adicionar card</button>
        </form>
      </section>

      <section>
        <h2>Agentes</h2>
        <div id="agentsList" class="agents-list"></div>
      </section>

      <section>
        <h2>Eventos</h2>
        <ul id="eventLog" class="event-log"></ul>
      </section>
    </aside>

    <section class="workspace">
      <div id="view3d" class="view view-3d active">
        <canvas id="sceneCanvas"></canvas>
        <p class="hint">Visão 3D da sala (inspiração: hubzz demo)</p>
      </div>

      <div id="view2d" class="view view-2d">
        <div class="kanban" id="kanbanBoard"></div>
      </div>

      <div id="terminalsLayer" class="terminals-layer"></div>
      <div id="agentTooltip" class="agent-tooltip" style="display: none;"></div>
    </section>
  </main>

  <!-- Modal Novo Agente -->
  <dialog id="agentModal" class="modal">
    <div class="modal-content">
      <h2>Criar Novo Agente</h2>
      <form id="agentForm" class="modal-form">
        <label>Nome / Role <input id="agentRole" required placeholder="Ex: Desenvolvedor React" /></label>
        <label>Categoria
          <select id="agentCategory">
            <option value="roadmap">Roadmap</option>
            <option value="seguranca">Segurança</option>
            <option value="performance">Performance</option>
            <option value="funcionalidades">Funcionalidades</option>
            <option value="testes">Testes</option>
            <option value="features">Features</option>
            <option value="misc">Geral</option>
          </select>
        </label>
        <label>Ferramenta (CLI)
          <select id="agentTool" required>
            <option value="">Carregando...</option>
          </select>
        </label>
        <label>Modelo
          <select id="agentModel" required>
            <option value="">Selecione a ferramenta primeiro</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelAgentBtn">Cancelar</button>
          <button type="submit" class="primary-btn">Criar Agente</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Modal Configurações -->
  <dialog id="settingsModal" class="modal">
    <div class="modal-content">
      <h2>Configurações do Kanban</h2>
      <form id="settingsForm" class="modal-form">
        <label>Diretório padrão para Clones
          <input id="configCloneDir" required placeholder="C:\Caminho\Para\Clones" />
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelSettingsBtn">Cancelar</button>
          <button type="submit" class="primary-btn">Salvar</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
      }
    </script>
  <script type="module" src="dist/app.js"></script>
</body>

</html>
